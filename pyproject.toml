[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ropecomb"
version = "1.0.0"
description = "Reference implementation of the RopeComb variable-ratio rope-and-pulley transmission"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Rami N. Mahdi" }]
keywords = ["mechanism", "transmission", "launch", "catapult", "least-squares"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.20", "scipy>=1.7"]

[project.optional-dependencies]
plot = ["matplotlib>=3.4"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
